# 复制成 rc-control.toml 再改。没有这个文件时全部用默认值。

# 输入超过这么久没更新，就当作输入丢失：输出回中、油门重新锁定。
heartbeat_timeout_ms = 300

[elrs]
# auto 按 USB 芯片自动找改过 USB 引脚的 AION Nano（CH9102，1a86:55d4）。
# 经 USB 转串口模块接 CRSF 脚的高频头（如 BETAFPV Micro TX）要写死端口，
# 例如 macOS "/dev/cu.usbserial-A9GMM867"、Windows "COM5"（--list-ports 查）。
port = "auto"
# AION Nano（USB 改引脚）用 115200；接 CRSF 脚的外置高频头一般是 400000。
baud = 115200
# 每隔多少毫秒发一帧通道；外置高频头建议 4（250 Hz）。
frame_interval_ms = 20
# 通道号从 1 开始。只用 1 到 4：5 以上是低精度开关通道。
steering_channel = 1
throttle_channel = 2
steering_invert = false
throttle_invert = false

[video]
# 图传。收到画面时界面切到图传样式，没有画面时是仪表盘。
enabled = true
# 接收 RTP 视频的 UDP 端口。内置图传会把画面发到这里；
# 改用外部 Aviateur 收图传时，把它的转发端口设成这个。
port = 5600
# 视频编码：h265（OpenIPC 默认）或 h264。
codec = "h265"

[radio]
# 内置图传接收：直接驱动 RTL8812AU 这类 USB 网卡（基于 Aviateur）。
# 和外部 Aviateur 二选一，不要同时开。
enabled = true
# auto 自动选网卡；也可以写网卡名的一部分，例如 "RTL8812AU"。
adapter = "auto"
# 摄像头发射的信道：161 = 5805 MHz。要和摄像头设置一致。
channel = 161
# 信道宽度：20 或 40。
width_mhz = 20
# 地面站密钥 gs.key 的路径；不填就用 OpenIPC 默认密钥。
# key = "/path/to/gs.key"

[wheel]
# 方向盘（MOZA R5 / R5 Pro，或 Thrustmaster T300RS），直接读 HID。
# 插着就接管转向和油门，没插或 250 ms 没有新数据时，回到窗口里的滑条。
enabled = true
# 输入端反向：按个人习惯。（车上舵机方向反了用控制面板的“转向反向”。）
steering_invert = false
throttle_invert = false
# 转向中位死区 0..0.1，盘的细小抖动不算转向。
steering_deadzone = 0.02
# auto：优先 MOZA R5（346e:0004），没有再找 T300RS（044f:b66e）。
device = "auto"
