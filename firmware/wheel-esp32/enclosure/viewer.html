<title>外殼組裝模擬</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: CAD inspector. 3D viewport fills the left, an inspection panel on the right; stacks on phones. */
  :root {
    --bg: #e9edf1;
    --panel: #f8fafb;
    --line: #d3dae2;
    --fg: #16202b;
    --muted: #5a6776;
    --accent: #d9732b;
    --viewport: #dfe5eb;
    --ok: #1e8a52;
    --ok-bg: #dcf1e5;
    --bad: #c93636;
    --bad-bg: #f8e0e0;
    --font-ui: "IBM Plex Sans", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    --font-data: "IBM Plex Mono", "SF Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10151b; --panel: #161c24; --line: #263040; --fg: #e4e9ef; --muted: #8b98a8;
      --accent: #f0904a; --viewport: #0c1116; --ok: #4fcf8a; --ok-bg: #12301f; --bad: #ff6b6b; --bad-bg: #3a1717;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10151b; --panel: #161c24; --line: #263040; --fg: #e4e9ef; --muted: #8b98a8;
    --accent: #f0904a; --viewport: #0c1116; --ok: #4fcf8a; --ok-bg: #12301f; --bad: #ff6b6b; --bad-bg: #3a1717;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px;
    display: flex; flex-direction: column;
  }
  .app { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 0; }
  .viewport { position: relative; background: var(--viewport); min-height: 0; }
  .viewport canvas { display: block; width: 100%; height: 100%; }
  .views {
    position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px;
    display: flex; gap: 4px; flex-wrap: wrap;
  }
  .views button, .chip, .tab, .btn {
    font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; cursor: pointer;
  }
  .views button { padding: 4px 10px; font-size: 12px; }
  .views button:hover, .chip:hover, .btn:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .loading {
    position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted);
    font-family: var(--font-data); font-size: 12px; letter-spacing: 0.04em;
  }
  aside {
    background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto;
    padding-block: 18px 24px; padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 18px;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0; text-wrap: balance; }
  .lede { margin: 4px 0 0; color: var(--muted); line-height: 1.5; }
  .label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    margin: 0 0 8px;
  }
  .tabs { display: grid; gap: 6px; }
  .tab { text-align: left; padding: 9px 11px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
  .tab[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .tab .name { font-weight: 500; }
  .tab .sub { grid-column: 1; color: var(--muted); font-size: 12px; font-family: var(--font-data); }
  .pill {
    grid-row: 1 / span 2; grid-column: 2; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px;
    white-space: nowrap;
  }
  .pill.ok { color: var(--ok); background: var(--ok-bg); }
  .pill.bad { color: var(--bad); background: var(--bad-bg); }
  .control { display: grid; grid-template-columns: 76px minmax(0, 1fr) 54px; align-items: center; gap: 8px; margin-bottom: 8px; }
  .control span:last-child { font-family: var(--font-data); font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .btn { padding: 6px 12px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .chip { padding: 3px 9px; font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
  .chip[aria-pressed="false"] { opacity: 0.45; }
  .swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  td { padding: 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.num { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 8px; }
  td.num.ok { color: var(--ok); }
  td.num.bad { color: var(--bad); font-weight: 500; }
  tr.bad td:first-child { color: var(--bad); }
  .where { display: block; color: var(--muted); font-family: var(--font-data); font-size: 11px; margin-top: 2px; }
  .note { color: var(--muted); font-size: 12px; line-height: 1.55; margin: 6px 0 0; }
  .summary { padding: 10px 12px; border-radius: 8px; line-height: 1.5; }
  .summary.ok { background: var(--ok-bg); color: var(--ok); }
  .summary.bad { background: var(--bad-bg); color: var(--bad); }
  @media (max-width: 820px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 58vh auto; }
    body { height: auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow: visible; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <div class="viewport" id="viewport">
    <div class="loading" id="loading">正在載入模型…</div>
    <div class="views" id="views">
      <button type="button" data-view="iso">等角</button>
      <button type="button" data-view="front">正面</button>
      <button type="button" data-view="back">背面</button>
      <button type="button" data-view="top">上</button>
      <button type="button" data-view="bottom">下</button>
      <button type="button" data-view="left">左</button>
      <button type="button" data-view="right">右</button>
    </div>
  </div>

  <aside>
    <header>
      <h1>外殼組裝模擬</h1>
      <p class="lede">v2 外殼：高頻頭從後面插進 45 × 60 的模組倉；圓屏背面用 3M 膠貼在底板的立柱上，玻璃從頂面的開孔露出；MB102 電源用 3M 膠貼在墊台上。載入要列印的外殼和零件示意模型，用精確的幾何布林運算算出每兩個零件的重疊體積，紅色就是會頂到的地方。</p>
    </header>

    <section>
      <p class="label">設計</p>
      <div class="tabs" id="tabs"></div>
    </section>

    <section id="summary"></section>

    <section>
      <p class="label">檢視</p>
      <div class="control"><label for="explode">爆炸</label><input id="explode" type="range" min="0" max="1" step="0.01" value="0.35"><span id="explodeVal"></span></div>
      <div class="control"><label for="opacity">外殼透明</label><input id="opacity" type="range" min="0.12" max="1" step="0.01" value="0.45"><span id="opacityVal"></span></div>
      <div class="control"><label for="section">剖面</label><input id="section" type="range" min="0" max="1" step="0.005" value="1"><span id="sectionVal"></span></div>
      <div class="row">
        <button type="button" class="btn primary" id="assemble">播放組裝</button>
        <button type="button" class="chip" id="axisX" aria-pressed="true">剖 X（左右）</button>
        <button type="button" class="chip" id="axisY" aria-pressed="false">剖 Y（前後）</button>
      </div>
    </section>

    <section>
      <p class="label">零件</p>
      <div class="row" id="parts"></div>
    </section>

    <section>
      <p class="label">碰撞檢查</p>
      <table><tbody id="checks"></tbody></table>
      <p class="note">每兩個零件算一次交集體積（mm³）。0 代表最多只是面貼面；零件示意模型照規格書和照片估計，主要用來看相對位置。</p>
    </section>

    <section>
      <p class="label">螺絲對位</p>
      <table><tbody id="screws"></tbody></table>
      <p class="note">每根螺絲柱到最近的底板孔的距離。超過 0.3 mm 就鎖不進去。</p>
    </section>
  </aside>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const SCENARIOS = {
  design: { name: "v2 外殼", sub: "body.stl + plate.stl" },
};
// Exploded offsets per part, in mm at explode = 1, and which assembly each part moves with.
const PARTS = {
  body:   { color: 0xb7bec7, move: [0, 0, 40] },
  usba:   { color: 0xa9b3bf, move: [-24, 0, 40] },
  header: { color: 0xe0a526, move: [0, 0, 40] },
  screen: { color: 0x2b3f57, move: [0, 0, 90] },
  plate:  { color: 0x7d8792, move: [0, 0, -30] },
  board:  { color: 0x24907f, move: [0, 0, -14] },
  dupont: { color: 0xe0a526, move: [0, 0, -14] },
  plug:   { color: 0x59616d, move: [0, -34, -14] },
  power:  { color: 0x3f7fd0, move: [0, 0, -14] },
  dcplug: { color: 0x59616d, move: [34, 0, -14] },
  module: { color: 0x474e5a, move: [0, 60, 0] },
};
const OVERLAP_COLOR = 0xff2d2d;

const viewport = document.getElementById("viewport");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.localClippingEnabled = true;
viewport.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 1, 5000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(-120, -180, 260);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.5);
fill.position.set(160, 140, 60);
scene.add(fill);

const clipPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 1e4);
const cache = new Map();
const groups = {};       // part -> THREE.Group
let report, current = "design", sectionAxis = "x", overlapMesh = null;
const hidden = new Set();
let dims;

function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function applyTheme() { scene.background = new THREE.Color(cssVar("--viewport") || "#dfe5eb"); }
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

// Each scenario file maps part -> base64 little-endian float32 triangle soup (x, y, z per vertex).
function geometryFromB64(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(bytes.buffer), 3));
  geo.computeVertexNormals();
  return geo;
}
function loadScenario(name) {
  if (!cache.has(name)) {
    cache.set(name, fetch(`assets/${name}.json`).then(r => {
      if (!r.ok) throw new Error(`${name}.json: HTTP ${r.status}`);
      return r.json();
    }).then(obj => Object.fromEntries(Object.entries(obj).map(([k, v]) => [k, geometryFromB64(v)]))));
  }
  return cache.get(name);
}

function makePart(geo, color, transparent) {
  const g = new THREE.Group();
  const front = new THREE.MeshStandardMaterial({
    color, roughness: 0.75, metalness: 0.05, side: THREE.FrontSide,
    transparent, opacity: 1, depthWrite: !transparent, clippingPlanes: [clipPlane],
  });
  // Back faces, darker: where the section plane cuts, they read as the cut face.
  const back = new THREE.MeshBasicMaterial({
    color: new THREE.Color(color).multiplyScalar(0.45), side: THREE.BackSide, clippingPlanes: [clipPlane],
    transparent, opacity: 1,
  });
  g.add(new THREE.Mesh(geo, front), new THREE.Mesh(geo, back));
  return g;
}

async function showScenario(name) {
  current = name;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-pressed", String(t.dataset.s === name)));
  const s = report.scenarios[name];
  let meshes;
  try {
    meshes = await loadScenario(name);
  } catch (err) {
    document.getElementById("loading").hidden = false;
    document.getElementById("loading").textContent = "載入模型失敗，請重新整理頁面。";
    return;
  }
  if (current !== name) return;
  const geos = s.parts.map(p => meshes[p]);
  const ov = meshes.overlap || null;
  for (const k of Object.keys(groups)) { scene.remove(groups[k]); delete groups[k]; }
  if (overlapMesh) { scene.remove(overlapMesh); overlapMesh = null; }
  s.parts.forEach((p, i) => {
    const grp = makePart(geos[i], PARTS[p].color, p === "body");
    grp.userData.move = PARTS[p].move;
    groups[p] = grp;
    scene.add(grp);
  });
  if (ov) {
    overlapMesh = new THREE.Mesh(ov, new THREE.MeshBasicMaterial({ color: OVERLAP_COLOR, depthTest: false, transparent: true, opacity: 0.9 }));
    overlapMesh.renderOrder = 10;
    scene.add(overlapMesh);
  }
  renderPanel();
  applyAll();
  document.getElementById("loading").hidden = true;
}

function applyAll() {
  const ex = +document.getElementById("explode").value;
  const op = +document.getElementById("opacity").value;
  const sec = +document.getElementById("section").value;
  document.getElementById("explodeVal").textContent = `${Math.round(ex * 100)}%`;
  document.getElementById("opacityVal").textContent = `${Math.round(op * 100)}%`;
  for (const [p, g] of Object.entries(groups)) {
    const [mx, my, mz] = g.userData.move;
    g.position.set(mx * ex, my * ex, mz * ex);
    g.visible = !hidden.has(p);
    if (p === "body") {
      g.children[0].material.opacity = op;
      g.children[1].material.opacity = op;
      g.children[0].material.depthWrite = op > 0.95;
    }
  }
  if (overlapMesh) {
    // Overlaps belong to two parts; show them only when nothing is exploded apart.
    overlapMesh.visible = !hidden.has("overlap") && ex < 0.02;
  }
  const span = sectionAxis === "x" ? dims.W : dims.D;
  if (sec >= 0.999) {
    clipPlane.constant = 1e4;
    document.getElementById("sectionVal").textContent = "關";
  } else {
    const pos = -5 + sec * (span + 10);
    clipPlane.normal.set(sectionAxis === "x" ? -1 : 0, sectionAxis === "y" ? -1 : 0, 0);
    clipPlane.constant = pos;
    document.getElementById("sectionVal").textContent = `${pos.toFixed(0)} mm`;
  }
}

function fmt(v) { return v.toFixed(v < 10 ? 2 : 1); }

function renderPanel() {
  const s = report.scenarios[current];
  const L = report.labels;
  const bad = s.checks.filter(c => c.overlap > 0.01);
  const badScrews = s.screws.filter(sc => sc.offset > 0.3);
  const sum = document.getElementById("summary");
  if (!bad.length && !badScrews.length) {
    sum.innerHTML = `<div class="summary ok">全部吻合：${s.checks.length} 組零件零干涉，${s.screws.length} 顆螺絲全部對準。</div>`;
  } else {
    sum.innerHTML = `<div class="summary bad">${bad.length} 組零件互相頂到，${badScrews.length} 顆螺絲對不上。把「爆炸」拉到 0 可以看到紅色的重疊位置。</div>`;
  }
  document.getElementById("checks").innerHTML = s.checks.map(c => {
    const isBad = c.overlap > 0.01;
    const where = isBad ? `<span class="where">x ${c.where[0]}–${c.where[3]} · y ${c.where[1]}–${c.where[4]} · z ${c.where[2]}–${c.where[5]} mm</span>` : "";
    return `<tr class="${isBad ? "bad" : ""}"><td>${L[c.a]} × ${L[c.b]}${where}</td><td class="num ${isBad ? "bad" : "ok"}">${isBad ? fmt(c.overlap) + " mm³" : "0"}</td></tr>`;
  }).join("");
  document.getElementById("screws").innerHTML = s.screws.map((sc, i) => {
    const isBad = sc.offset > 0.3;
    return `<tr class="${isBad ? "bad" : ""}"><td>螺絲 ${i + 1}<span class="where">柱位 x ${sc.x} · y ${sc.y}</span></td><td class="num ${isBad ? "bad" : "ok"}">${isBad ? "偏 " + sc.offset.toFixed(1) + " mm" : "對準"}</td></tr>`;
  }).join("");
}

function buildTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = Object.entries(SCENARIOS).map(([k, v]) => {
    const s = report.scenarios[k];
    const n = s.checks.filter(c => c.overlap > 0.01).length + s.screws.filter(sc => sc.offset > 0.3).length;
    const pill = n ? `<span class="pill bad">${n} 處問題</span>` : `<span class="pill ok">吻合</span>`;
    return `<button type="button" class="tab" data-s="${k}" aria-pressed="false"><span class="name">${v.name}</span>${pill}<span class="sub">${v.sub}</span></button>`;
  }).join("");
  tabs.addEventListener("click", ev => {
    const b = ev.target.closest(".tab");
    if (b) showScenario(b.dataset.s);
  });
}

function buildPartChips() {
  const L = { ...report.labels, overlap: "重疊（紅）" };
  const names = [...Object.keys(PARTS), "overlap"];
  const el = document.getElementById("parts");
  el.innerHTML = names.map(p => {
    const c = p === "overlap" ? OVERLAP_COLOR : PARTS[p].color;
    return `<button type="button" class="chip" data-p="${p}" aria-pressed="true"><span class="swatch" style="background:#${c.toString(16).padStart(6, "0")}"></span>${L[p]}</button>`;
  }).join("");
  el.addEventListener("click", ev => {
    const b = ev.target.closest(".chip");
    if (!b) return;
    const p = b.dataset.p;
    hidden.has(p) ? hidden.delete(p) : hidden.add(p);
    b.setAttribute("aria-pressed", String(!hidden.has(p)));
    applyAll();
  });
}

const target = new THREE.Vector3();
function setView(v) {
  target.set(dims.W / 2, dims.D / 2 + 6, 34);
  const d = 330;
  const dirs = {
    iso: [-0.75, -1, 0.85], front: [0, -1, 0.12], back: [0, 1, 0.25], top: [0, -0.001, 1],
    bottom: [0, -0.001, -1], left: [-1, 0, 0.15], right: [1, 0, 0.15],
  };
  const dir = new THREE.Vector3(...dirs[v]).normalize().multiplyScalar(d);
  camera.position.copy(target).add(dir);
  controls.target.copy(target);
  controls.update();
}
document.getElementById("views").addEventListener("click", ev => {
  const b = ev.target.closest("button[data-view]");
  if (b) setView(b.dataset.view);
});

["explode", "opacity", "section"].forEach(id => document.getElementById(id).addEventListener("input", applyAll));
function setAxis(a) {
  sectionAxis = a;
  document.getElementById("axisX").setAttribute("aria-pressed", String(a === "x"));
  document.getElementById("axisY").setAttribute("aria-pressed", String(a === "y"));
  if (+document.getElementById("section").value >= 0.999) document.getElementById("section").value = 0.5;
  applyAll();
}
document.getElementById("axisX").addEventListener("click", () => setAxis("x"));
document.getElementById("axisY").addEventListener("click", () => setAxis("y"));

let anim = null;
document.getElementById("assemble").addEventListener("click", () => {
  const el = document.getElementById("explode");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { el.value = 0; applyAll(); return; }
  const t0 = performance.now(), dur = 2200;
  el.value = 1; applyAll();
  anim = t => {
    const k = Math.min((t - t0) / dur, 1);
    const ease = 1 - Math.pow(1 - k, 3);
    el.value = (1 - ease).toFixed(3);
    applyAll();
    if (k >= 1) anim = null;
  };
});

function resize() {
  const r = viewport.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(r.height, 1);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(viewport);

renderer.setAnimationLoop(t => {
  if (anim) anim(t);
  controls.update();
  renderer.render(scene, camera);
});

async function boot() {
  applyTheme();
  try {
    report = await (await fetch("assets/checks.json")).json();
  } catch (err) {
    document.getElementById("loading").textContent = "載入檢查結果失敗，請重新整理頁面。";
    return;
  }
  dims = report.dims;
  buildTabs();
  buildPartChips();
  resize();
  setView("iso");
  await showScenario(current);
}
boot();
</script>
