dependencies:
  idf: ">=5.1"
  # USB host HID class driver (raw input reports for non-boot devices).
  espressif/usb_host_hid: "^1.0.3"
  # ESP32-S3: 1.28" round GC9A01 status screen.
  espressif/esp_lcd_gc9a01:
    version: "^2.0.0"
    rules:
      - if: "target == esp32s3"
  espressif/esp_lvgl_port:
    version: "^2.4.0"
    rules:
      - if: "target == esp32s3"
  # ESP32-P4: Waveshare 7B board support (EK79007 1024x600 MIPI-DSI panel,
  # GT911 touch, backlight) on its LVGL adapter.
  waveshare/esp32_p4_wifi6_touch_lcd_7b:
    version: "==3.0.1"
    rules:
      - if: "target == esp32p4"
  lvgl/lvgl: "==9.5.0"
