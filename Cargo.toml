[package]
name = "rc-control"
version = "0.1.0"
edition = "2021"
description = "PC-side controller for RC cars over ExpressLRS (CRSF), with OpenIPC video"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
ctrlc = "3"
eframe = "0.31"
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"] }
hidapi = { version = "2", default-features = false, features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serialport = { version = "4", default-features = false }
toml = "0.8"
toml_edit = "0.22"

[build-dependencies]
cmake = "0.1"
pkg-config = "0.3"

# 本机（Windows/UCRT64 GCC 16 + clang 23）下 bindgen 解析 hwcontext_d3d11va.h 的
# <d3d11.h>Windows 头链会把 amxintrin.h 的 __tile1024i_str 带进来，生成的
# packed+align 冲突结构体在 rustc 里编译不过（E0080/E0587）。已本地 vendored：
# hwcontext_stubs 里补了 d3d11/d3d12/d3d9/dxva2 的空 stub，让 SDK 头不被解析。
[patch.crates-io]
ffmpeg-sys-next = { path = "vendor/ffmpeg-sys-next-9.0.1" }

[profile.release]
lto = true
strip = true
